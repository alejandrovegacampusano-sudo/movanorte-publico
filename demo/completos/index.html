/* ====================== Motor de precios (mismo que el sistema) ============ */

const clp = (n) => "$" + Math.round(n).toLocaleString("es-CL");

function valorizar(prod, sel, cant) {
  const mods = [];
  for (const g of prod.grupos) {
    const elegidas = (sel[g.id] || [])
      .map((id) => g.opciones.find((o) => o.id === id))
      .filter(Boolean);
    // La cuota gratis se aplica a las opciones más caras del grupo.
    const gratis = new Set(
      [...elegidas].sort((a, b) => b.priceDelta - a.priceDelta)
        .slice(0, Math.max(0, g.cuotaGratis)).map((o) => o.id),
    );
    for (const o of elegidas) {
      mods.push({ grupo: g.nombre, nombre: o.nombre, cobrado: gratis.has(o.id) ? 0 : o.priceDelta });
    }
  }
  const extras = mods.reduce((t, m) => t + m.cobrado, 0);
  const unitario = prod.precioBase + extras;
  return { unitario, subtotal: unitario * cant, mods };
}

function validar(prod, sel) {
  const errs = [];
  for (const g of prod.grupos) {
    const el = (sel[g.id] || []).filter((id) => g.opciones.some((o) => o.id === id));
    if (el.some((id) => !g.opciones.find((o) => o.id === id).disponible)) {
      errs.push("Se acabó una de las opciones de " + g.nombre);
    }
    if (el.length < g.minSelect) {
      errs.push(g.minSelect === 1
        ? "Elige una opción de " + g.nombre
        : "Elige al menos " + g.minSelect + " en " + g.nombre);
    }
    const max = g.seleccion === "single" ? 1 : g.maxSelect;
    if (max !== null && el.length > max) {
      errs.push("Máximo " + max + (max === 1 ? " opción" : " opciones") + " en " + g.nombre);
    }
  }
  return errs;
}

function porDefecto(prod) {
  const sel = {};
  for (const g of prod.grupos) {
    const def = g.opciones.filter((o) => o.porDefecto && o.disponible);
    if (def.length) { sel[g.id] = def.map((o) => o.id); continue; }
    if (g.seleccion === "single" && g.minSelect > 0) {
      const p = g.opciones.find((o) => o.disponible);
      sel[g.id] = p ? [p.id] : [];
      continue;
    }
    sel[g.id] = [];
  }
  return sel;
}

// localStorage lanza, y la demo tiene que seguir funcionando igual.
const memoria = new Map();
const guardar = (k, v) => {
  memoria.set(k, v);
  try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
};
const leer = (k, alt) => {
  try {
    const v = localStorage.getItem(k);
    if (v !== null) return JSON.parse(v);
  } catch {}
  return memoria.has(k) ? memoria.get(k) : alt;
};

}

function observarCategorias() {
  const nav = document.querySelector(".nav");
  if (!nav || !("IntersectionObserver" in window)) return;
  const obs = new IntersectionObserver((entradas) => {
    for (const e of entradas) {
      if (!e.isIntersecting) continue;
      nav.querySelectorAll("button").forEach((b) =>
        b.setAttribute("aria-current", String(b.dataset.ir === e.target.id)));
      const activo = nav.querySelector('[aria-current="true"]');
      if (activo) activo.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
    }
  }, { rootMargin: "-54px 0px -72% 0px" });
  document.querySelectorAll(".cat").forEach((c) => obs.observe(c));

      ${tocado && errs.length ? `<div class="errores"><ul>${errs.map((e) => `<li>${esc(e)}</li>`).join("")}</ul></div>` : ""}
    </div>
    <div class="hoja-pie" style="display:flex;gap:11px;align-items:center">
      <div class="cant">
        <button data-cant="-1" aria-label="Quitar uno">−</button>
        <span>${cant}</span>
        <button data-cant="1" aria-label="Agregar uno">+</button>
      </div>
      <button class="btn-p" data-agregar ${errs.length ? "disabled" : ""} style="flex:1">
        <span>Agregar</span><span>${clp(v.subtotal)}</span></button>
    </div>`);
}

/* ---------------------------- Hoja: carrito ------------------------------- */

function pintarCarrito() {
  H = { tipo: "carrito" };
  const lineas = carroValorizado();
  const suc = sucursal();

  montarHoja(`
    <div class="hoja-cab"><h3>Tu pedido</h3>
      <button class="icono" data-cerrar aria-label="Cerrar">✕</button></div>
    <div class="hoja-cuerpo">
      ${lineas.length ? lineas.map((l) => `<div class="linea">
        <span style="font-size:23px">${l.prod.emoji}</span>
        <div class="det">
          <div class="nom">${esc(l.prod.nombre)}</div>
          ${l.mods.length ? `<div class="mods">${l.mods.map((m) => esc(m.nombre) + (m.cobrado > 0 ? " (+" + clp(m.cobrado) + ")" : "")).join(" · ")}</div>` : ""}
          ${l.linea.notas ? `<div class="nota">“${esc(l.linea.notas)}”</div>` : ""}
          <div style="display:flex;gap:10px;align-items:center;margin-top:8px">
            <div class="cant">
              <button data-lin="${l.linea.id}|-1" aria-label="Quitar uno">−</button>
              <span>${l.linea.cant}</span>
              <button data-lin="${l.linea.id}|1" aria-label="Agregar uno">+</button>
            </div>
            <button class="quitar" data-lin="${l.linea.id}|0">Quitar</button>
          </div>
        </div>
        <span class="precio">${clp(l.subtotal)}</span>
      </div>`).join("") : '<p style="color:var(--humo)">Todavía no agregas nada.</p>'}
    </div>
    <div class="hoja-pie">
      <div class="tot"><div class="grande" style="border:0;margin:0;padding:0">
        <span>Subtotal</span><span>${clp(subtotalCarro())}</span></div></div>
      <button class="btn-p" data-hoja="checkout" style="margin-top:12px"
        ${!lineas.length || !suc.abierta ? "disabled" : ""}>
        <span style="margin:0 auto">${suc.abierta ? "Continuar" : suc.nombre + " está cerrada"}</span></button>
    </div>`);
}

/* ---------------------------- Hoja: checkout ------------------------------ */

function abrirCheckout() {
  const suc = sucursal();
  H = {
    tipo: "checkout",
    entrega: suc.delivery.habilitado ? "delivery" : "retiro",
    zonaId: suc.delivery.zonas[0] ? suc.delivery.zonas[0].id : "",
    nombre: "", telefono: "", direccion: "", referencia: "", notas: "",
    propinaPct: 0, pagaCon: "", metodo: "", errores: [], malos: [],
  };
  pintarCheckout();
}

function mediosDe(entrega) {
  return D.local.mediosPago.filter((m) => m.habilitado && (!m.soloPara || m.soloPara === entrega));
}

function totalesCheckout() {
  const suc = sucursal();
  const sub = subtotalCarro();
  const zona = suc.delivery.zonas.find((z) => z.id === H.zonaId);
  const envio = H.entrega === "delivery" && zona ? zona.tarifa : 0;
  const propina = Math.round((sub * H.propinaPct) / 100);
  const falta = H.entrega === "delivery" ? Math.max(0, suc.delivery.minimoCompra - sub) : 0;
  const espera = suc.tiempoPreparacionMin + (H.entrega === "delivery" && zona ? zona.tiempoExtraMin : 0);
  return { sub, envio, propina, total: sub + envio + propina, zona, falta, espera, suc };
}

function pintarCheckout() {
  const t = totalesCheckout();
  // Un campo marcado en rojo dice *dónde* está el problema; el texto del aviso
  // solo dice que lo hay.
  const malo = (campo) => (H.malos || []).includes(campo) ? " malo" : "";
  const medios = mediosDe(H.entrega);
  if (!medios.some((m) => m.id === H.metodo)) H.metodo = medios[0] ? medios[0].id : "";
  const etiquetaKind = {
    online: "Pagas ahora, en línea",
    manual_prepago: "Transfieres y el local confirma",
    contra_entrega: "Pagas al recibir",
  };

  montarHoja(`
    <div class="hoja-cab">
      <button class="icono" data-hoja="carrito" aria-label="Volver">←</button>
      <h3>Finalizar pedido</h3>
      <button class="icono" data-cerrar aria-label="Cerrar">✕</button>
    </div>
    <div class="hoja-cuerpo">
      ${D.local.sucursales.length > 1 ? `<div class="grupo">
        <div class="grupo-cab"><h4>Sucursal</h4></div>
        <div class="chips">${D.local.sucursales.map((s) => `<button class="chip${s.id === S.sucursalId ? " on" : ""}"
          data-suc="${s.id}" ${s.abierta ? "" : "disabled"}>
          <b>${esc(s.nombre)}</b><span>${s.abierta ? esc(s.horario.split(",")[1] || "") : "cerrada"}</span></button>`).join("")}</div>
      </div>` : ""}

      <div class="grupo">
        <div class="grupo-cab"><h4>¿Cómo lo quieres?</h4></div>
        <div class="chips">
          <button class="chip${H.entrega === "retiro" ? " on" : ""}" data-entrega="retiro">
            <b>Retiro en local</b><span>${esc(t.suc.direccion)}</span></button>
          <button class="chip${H.entrega === "delivery" ? " on" : ""}" data-entrega="delivery"
            ${t.suc.delivery.habilitado ? "" : "disabled"}>
            <b>Delivery</b><span>${t.suc.delivery.habilitado ? "Según tu zona" : "No disponible"}</span></button>
        </div>
      </div>

      ${H.entrega === "delivery" ? `<div class="grupo">
        <div class="grupo-cab"><h4>¿Dónde lo llevamos?</h4></div>
        <label class="campo"><span>Zona</span><select data-campo="zonaId">
          ${t.suc.delivery.zonas.map((z) => `<option value="${z.id}" ${z.id === H.zonaId ? "selected" : ""}>
            ${esc(z.nombre)} · ${clp(z.tarifa)} · +${z.tiempoExtraMin} min</option>`).join("")}
        </select></label>
        <label class="campo${malo("direccion")}"><span>Dirección</span>
          <input type="text" data-campo="direccion" value="${esc(H.direccion)}" placeholder="Calle, número, depto"></label>
        <label class="campo"><span>Referencia (opcional)</span>
          <input type="text" data-campo="referencia" value="${esc(H.referencia)}" placeholder="Portón negro, timbre 2"></label>
        ${t.falta > 0 ? `<p class="pista" style="color:var(--ambar)">Te faltan ${clp(t.falta)} para el mínimo de delivery (${clp(t.suc.delivery.minimoCompra)}).</p>` : ""}
      </div>` : ""}

      <div class="grupo">
        <div class="grupo-cab"><h4>Tus datos</h4></div>
        <label class="campo${malo("nombre")}"><span>Nombre</span>
          <input type="text" data-campo="nombre" value="${esc(H.nombre)}" placeholder="Tu nombre"></label>
        <label class="campo${malo("telefono")}"><span>Teléfono</span>
          <input type="tel" data-campo="telefono" value="${esc(H.telefono)}" placeholder="+56 9 1234 5678"></label>
      </div>

      <div class="grupo">
        <div class="grupo-cab"><h4>Propina para el equipo</h4></div>
        <div class="chips">${[0, 5, 10, 15].map((p) => `<button class="chip${H.propinaPct === p ? " on" : ""}"
          data-propina="${p}"><b>${p === 0 ? "Sin propina" : p + "%"}</b></button>`).join("")}</div>
      </div>

      <div class="grupo">
        <div class="grupo-cab"><h4>¿Cómo pagas?</h4></div>
        ${medios.map((m) => `<button class="pago${m.id === H.metodo ? " on" : ""}" data-metodo="${m.id}">
          <span class="punto"></span>
          <span style="flex:1"><b>${esc(m.nombre)}</b><span>${etiquetaKind[m.kind]}</span></span>
        </button>`).join("")}
        ${H.entrega === "delivery" && D.local.mediosPago.some((m) => m.soloPara === "retiro" && m.habilitado)
          ? '<p class="pista">La Beca JUNAEB solo sirve para retiro: la tarjeta se pasa por la máquina del local.</p>' : ""}
        ${H.metodo === "efectivo" ? `<label class="campo" style="margin-top:10px"><span>¿Con cuánto pagas? (para el vuelto)</span>
          <input type="tel" data-campo="pagaCon" value="${esc(H.pagaCon)}" placeholder="${t.total}"></label>` : ""}
      </div>

      <div class="grupo">
        <div class="grupo-cab"><h4>Notas del pedido</h4></div>
        <textarea rows="2" maxlength="300" data-campo="notas" placeholder="Algo que el local deba saber">${esc(H.notas)}</textarea>
      </div>

    </div>
    <div class="hoja-pie">
      ${H.errores.length ? `<div class="errores pie"><ul>${H.errores.map((e) => `<li>${esc(e)}</li>`).join("")}</ul></div>` : ""}
      <div class="tot">
        <div><span>Subtotal</span><span>${clp(t.sub)}</span></div>
        ${t.envio ? `<div><span>Delivery · ${esc(t.zona.nombre)}</span><span>${clp(t.envio)}</span></div>` : ""}
        ${t.propina ? `<div><span>Propina ${H.propinaPct}%</span><span>${clp(t.propina)}</span></div>` : ""}
        <div class="grande"><span>Total</span><span>${clp(t.total)}</span></div>
      </div>
      <p class="espera">Listo en aproximadamente ${t.espera} minutos.</p>
      <button class="btn-p" data-confirmar ${t.falta > 0 || !H.metodo ? "disabled" : ""} style="margin-top:10px">
        <span style="margin:0 auto">${t.falta > 0 ? "Faltan " + clp(t.falta) + " para el mínimo" : "Confirmar pedido · " + clp(t.total)}</span>
      </button>
    </div>`);
}
</script>

<script>
/* ========================= Crear el pedido ================================ */

const ESTADOS = ["recibido", "en_preparacion", "listo", "entregado"];

function confirmarPedido() {
  const t = totalesCheckout();
  const medio = D.local.mediosPago.find((m) => m.id === H.metodo);
  const errs = [];
  const malos = [];

  if (!H.nombre.trim()) { errs.push("Falta tu nombre."); malos.push("nombre"); }
  if (!/^[0-9+ ]{8,15}$/.test(H.telefono.trim())) { errs.push("Revisa el teléfono."); malos.push("telefono"); }
  if (H.entrega === "delivery" && !H.direccion.trim()) {
    errs.push("Falta la dirección de despacho."); malos.push("direccion");
  }
  if (!medio) errs.push("Elige un medio de pago.");
  if (medio && medio.id === "efectivo" && H.pagaCon && Number(H.pagaCon) < t.total) {
    errs.push("El monto con que pagas es menor al total."); malos.push("pagaCon");
  }

  if (errs.length) {
    H.errores = errs; H.malos = malos;
    pintarCheckout();
    // El formulario es más largo que la pantalla: sin esto el aviso aparece en
    // una parte de la hoja que no se está mirando y el botón parece muerto.
    const primero = malos.length && document.querySelector(`[data-campo="${malos[0]}"]`);
    if (primero) {
      primero.scrollIntoView({ block: "center", behavior: "smooth" });
      primero.focus({ preventScroll: true });
    }
    return;
  }
  H.malos = [];

  const previos = pedidos();
  const orden = {
    id: "o" + Date.now(),
    codigo: "P" + (1000 + previos.length + 1),
    sucursalId: S.sucursalId,
    sucursalNombre: t.suc.nombre,
    entrega: H.entrega,
    // Solo el pago contra entrega entra directo a la cocina.
    estado: medio.kind === "contra_entrega" ? "recibido" : "pendiente_pago",
    items: carroValorizado().map((l) => ({
      nombre: l.prod.nombre, emoji: l.prod.emoji, cant: l.linea.cant,
      unitario: l.unitario, subtotal: l.subtotal,
      mods: l.mods.map((m) => m.nombre), notas: l.linea.notas || "",
    })),
    sub: t.sub, envio: t.envio, propina: t.propina, total: t.total,
    cliente: {
      nombre: H.nombre.trim(), telefono: H.telefono.trim(),
      direccion: H.direccion.trim(), referencia: H.referencia.trim(),
      zona: t.zona ? t.zona.nombre : "",
    },
    pago: {
      metodo: medio.id, nombre: medio.nombre, kind: medio.kind,
      estado: "pendiente", pagaCon: H.pagaCon ? Number(H.pagaCon) : null,
      instrucciones: medio.instrucciones || "",
    },
    notas: H.notas.trim(),
    espera: t.espera,
    creado: new Date().toISOString(),
  };

  guardar("sc-pedidos", [...previos, orden]);
  S.carro = []; guardar("sc-carro", []);
  S.pedidoActivo = orden.id;

  if (medio.kind === "online") { pintarPasarela(orden); return; }
  cerrarHoja();
  S.vista = "pedido";
  render();
}

function actualizarPedido(id, cambios) {
  const lista = pedidos().map((p) => (p.id === id ? { ...p, ...cambios } : p));
  guardar("sc-pedidos", lista);
  return lista.find((p) => p.id === id);
}

/* ------------------------- Pasarela simulada ------------------------------ */

function pintarPasarela(orden) {
  H = { tipo: "pasarela", orden };
  montarHoja(`
    <div class="hoja-cab"><h3>${esc(orden.pago.nombre)}</h3>
      <button class="icono" data-cerrar aria-label="Cerrar">✕</button></div>
    <div class="hoja-cuerpo" style="text-align:center;padding:28px 20px">
      <p class="pista" style="text-transform:uppercase;letter-spacing:.09em;font-weight:700">Pasarela de prueba</p>
      <p style="margin:6px 0 0;font-size:14px;color:var(--humo)">Pedido ${esc(orden.codigo)} · ${esc(orden.sucursalNombre)}</p>
      <p style="font-size:38px;font-weight:800;margin:12px 0 0;font-variant-numeric:tabular-nums">${clp(orden.total)}</p>
      <p class="pista" style="margin-top:16px">Así se ve el paso por el portal del banco. En el sistema real, el pago lo
        confirma el aviso del proveedor y no el navegador: si cierras la pestaña, el pedido igual entra.</p>
    </div>
    <div class="hoja-pie">
      <button class="btn-p" data-pagar="ok" style="background:var(--verde);box-shadow:none">
        <span style="margin:0 auto">Aprobar el pago</span></button>
      <button class="btn-s" data-pagar="no" style="margin-top:8px">Rechazar</button>
    </div>`);
}

function resolverPago(ok) {
  const o = H.orden;
  actualizarPedido(o.id, ok
    ? { pago: { ...o.pago, estado: "pagado" }, estado: "recibido" }
    : { pago: { ...o.pago, estado: "fallido" } });
  cerrarHoja();
  S.vista = "pedido";
  render();
}

/* =========================== Vista: pedido ================================ */

/**
 * Hora aproximada de entrega, en reloj y no en cuenta regresiva: "listo a las
 * 21:40" se entiende de una y no obliga a tener la pantalla abierta. Va en
 * formato de 24 horas porque el local atiende hasta la 01:00.
 */
function horaEstimada(o) {
  const listo = new Date(new Date(o.creado).getTime() + (o.espera || 25) * 60000);
  return listo.toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit", hour12: false });
}

const PASOS = [
  ["recibido", "Recibido", "El local ya vio tu pedido"],
  ["en_preparacion", "En preparación", "Lo están cocinando"],
  ["listo", "Listo", "Preparado y esperando"],
  ["entregado", "Entregado", "¡Que lo disfrutes!"],
];

function pintarPedido() {
  const o = pedidos().find((p) => p.id === S.pedidoActivo);
  if (!o) { S.vista = "tienda"; return render(); }

  const idx = ESTADOS.indexOf(o.estado);
  const esperando = o.estado === "pendiente_pago";
  const fallido = o.pago.estado === "fallido";

  app.innerHTML = `<div class="marco">
    <p class="aviso"><b>Demo</b> · Los pedidos se guardan solo en este dispositivo · <a href="https://movanorte.cl" style="color:inherit;text-decoration:underline">movanorte.cl</a></p>
    <header class="pedido-cab">
      <button class="btn-s" data-vista="tienda" style="width:auto;padding:6px 12px;font-size:13px;background:rgba(255,255,255,.16);border-color:transparent;color:#fff">← Volver a la carta</button>
      <p style="margin:16px 0 0;font-size:13px;opacity:.85">Tu pedido</p>
      <div class="codigo">${esc(o.codigo)}</div>
      <p style="margin:8px 0 0;font-size:14px;opacity:.9">
        ${o.entrega === "retiro" ? "Retiro en " + esc(o.sucursalNombre) : "Delivery a " + esc(o.cliente.direccion)}</p>
      <p style="margin:0;font-size:13px;opacity:.75">Sucursal ${esc(o.sucursalNombre)}</p>
      ${!["entregado", "cancelado"].includes(o.estado) ? `
      <div style="margin-top:16px;background:rgba(255,255,255,.15);border-radius:12px;padding:11px 14px">
        <p style="margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.75">
          ${o.entrega === "delivery" ? "Llega alrededor de las" : "Listo para retirar a las"}</p>
        <p style="margin:2px 0 0;font-size:25px;font-weight:800">${horaEstimada(o)}</p>
        <p style="margin:2px 0 0;font-size:11.5px;opacity:.75">
          Es una estimación: puede moverse si la cocina está muy cargada.</p>
      </div>` : ""}
    </header>
    <main>
      ${fallido ? '<div class="banda ambar"><b>El pago fue rechazado.</b> Vuelve a intentarlo o elige otro medio de pago.</div>' : ""}
      ${esperando && !fallido ? `<div class="banda ambar"><b>Esperando la confirmación del pago.</b>
        ${o.pago.kind === "manual_prepago"
          ? "Transfiere " + clp(o.total) + " indicando el código " + esc(o.codigo) + ". Apenas el local lo verifique, entra a cocina."
          : "Apenas el proveedor confirme, el pedido entra a la cocina."}
        ${o.pago.instrucciones ? '<p style="margin:8px 0 0;font-weight:600">' + esc(o.pago.instrucciones) + "</p>" : ""}</div>` : ""}

      ${!esperando ? `<ol class="pasos">${PASOS.map(([e, tit, det], i) => {
        const ok = i <= idx;
        return `<li class="paso${ok ? " ok" : ""}">
          <div class="col"><span class="bolita">${ok ? "✓" : i + 1}</span>${i < 3 ? '<span class="tubo"></span>' : ""}</div>
          <div class="cont"><b>${tit}${i === idx ? '<span class="ahora">● ahora</span>' : ""}</b><p>${det}</p></div>
        </li>`;
      }).join("")}</ol>` : ""}

      <div class="tarjeta">
        <h3>Detalle</h3>
        ${o.items.map((it) => `<div class="linea">
          <span style="color:var(--humo);font-weight:700">${it.cant}×</span>
          <div class="det"><div class="nom">${esc(it.nombre)}</div>
            ${it.mods.length ? `<div class="mods">${esc(it.mods.join(" · "))}</div>` : ""}
            ${it.notas ? `<div class="nota">“${esc(it.notas)}”</div>` : ""}</div>
          <span class="precio">${clp(it.subtotal)}</span></div>`).join("")}
        <div class="tot" style="margin-top:12px">
          <div><span>Subtotal</span><span>${clp(o.sub)}</span></div>
          ${o.envio ? `<div><span>Delivery</span><span>${clp(o.envio)}</span></div>` : ""}
          ${o.propina ? `<div><span>Propina</span><span>${clp(o.propina)}</span></div>` : ""}
          <div class="grande"><span>Total</span><span>${clp(o.total)}</span></div>
        </div>
        <p class="espera">${esc(o.pago.nombre)} · ${
          o.pago.estado === "pagado" ? "pagado"
          : o.pago.kind === "contra_entrega" ? "se paga al recibir" : "pendiente"}
          ${o.pago.pagaCon ? " · vuelto de " + clp(o.pago.pagaCon - o.total) : ""}</p>
      </div>
      ${(() => {
        const suc = D.local.sucursales.find((x) => x.id === o.sucursalId);
        return suc ? `<div class="tarjeta">
          <h3>¿Algún problema con tu pedido?</h3>
          <p style="margin:0 0 11px;font-size:13.5px;color:var(--humo)">
            Llama directo a ${esc(suc.nombre)} y menciona el código <b>${esc(o.codigo)}</b>.</p>
          <a href="tel:${suc.telefono.replace(/\s/g, "")}" class="btn-p"
             style="text-decoration:none;justify-content:center">Llamar al ${esc(suc.telefono)}</a>
          <p style="margin:8px 0 0;font-size:11.5px;color:var(--humo)">
            ${esc(suc.direccion)} · ${esc(suc.horario)}</p>
        </div>` : "";
      })()}
      <p class="pie">La cocina mueve el estado desde su pantalla ·
        <button data-vista="cocina">Ver pantalla de cocina</button></p>
    </main>
  </div>`;
}

/* =========================== Vista: cocina ================================ */

const COLUMNAS = [
  ["Esperando pago", ["pendiente_pago"], null, null],
  ["Nuevos", ["recibido"], "en_preparacion", "Empezar"],
  ["En preparación", ["en_preparacion"], "listo", "Marcar listo"],
  ["Listos", ["listo"], "entregado", "Entregado"],
];

let filtroSucursal = "";

function pintarCocina() {
  const todos = pedidos().filter((p) => !filtroSucursal || p.sucursalId === filtroSucursal);
  const activos = todos.filter((p) => !["entregado", "cancelado"].includes(p.estado));

  app.innerHTML = `<div class="cocina">
    <div class="cocina-cab">
      <h2>Cocina · El Señor de los Completos</h2>
      <span class="pastilla">${activos.length} activos</span>
      <button class="pastilla" data-vista="panel">Datos</button>
      <button class="pastilla" data-vista="tienda">← Tienda</button>
    </div>
    <div class="cocina-cab" style="border:0;position:static;padding-top:10px;padding-bottom:0">
      <button class="pastilla" data-filtro="" style="${filtroSucursal === "" ? "background:#f6e7dc;color:#17100d;font-weight:700" : ""}">Todas</button>
      ${D.local.sucursales.map((s) => `<button class="pastilla" data-filtro="${s.id}"
        style="${filtroSucursal === s.id ? "background:#f6e7dc;color:#17100d;font-weight:700" : ""}">${esc(s.nombre)}</button>`).join("")}
    </div>
    ${COLUMNAS.map(([titulo, estados, siguiente, accion]) => {
      const items = todos.filter((p) => estados.includes(p.estado));
      return `<section class="col-cocina">
        <h3>${titulo} · ${items.length}</h3>
        ${items.length ? items.map((o) => `<article class="comanda">
          <div class="comanda-cab"><b>${esc(o.codigo)}</b>
            <span>${new Date(o.creado).toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" })}</span></div>
          <div class="tags">
            <span class="tag suc">${esc(o.sucursalNombre)}</span>
            <span class="tag ${o.entrega === "delivery" ? "entrega" : "retiro"}">${o.entrega.toUpperCase()}</span>
            <span class="tag ${o.pago.estado === "pagado" ? "pagado" : "cobrar"}">${
              o.pago.estado === "pagado" ? "PAGADO"
              : o.pago.kind === "contra_entrega" ? "COBRAR " + clp(o.total) : "SIN PAGAR"}</span>
          </div>
          <ul>${o.items.map((it) => `<li><b>${it.cant}× ${esc(it.nombre)}</b>
            ${it.mods.length ? `<span class="m">${esc(it.mods.join(" · "))}</span>` : ""}
            ${it.notas ? `<span class="n">⚠ ${esc(it.notas)}</span>` : ""}</li>`).join("")}</ul>
          ${o.notas ? `<p class="cliente" style="color:#ffcf8f">⚠ ${esc(o.notas)}</p>` : ""}
          <p class="cliente">${esc(o.cliente.nombre)} · ${esc(o.cliente.telefono)}${
            o.entrega === "delivery" ? " · " + esc(o.cliente.direccion) : ""}${
            o.pago.pagaCon ? " · vuelto " + clp(o.pago.pagaCon - o.total) : ""}</p>
          <div class="acc">
            ${o.estado === "pendiente_pago" && o.pago.kind === "manual_prepago"
              ? `<button data-avanzar="${o.id}|recibido">Confirmar pago</button>`
              : siguiente ? `<button data-avanzar="${o.id}|${siguiente}">${accion}</button>` : ""}
            <button class="gris" data-avanzar="${o.id}|cancelado">Rechazar</button>
          </div>
        </article>`).join("") : '<p class="vacio">Nada por acá</p>'}
      </section>`;
    }).join("")}
  </div>`;
}

/* =========================== Vista: panel ================================= */

const COL = ["#c2410c", "#2f6fd0"];

function columnas(puntos, formato) {
  const max = Math.max(1, ...puntos.map((p) => p.valor));
  return `<div class="cols">${puntos.map((p) =>
    `<i class="c" style="height:${Math.max(2, (p.valor / max) * 100)}%" title="${esc(p.etiqueta)}: ${formato(p.valor)}"></i>`
  ).join("")}</div>
  <div class="ejes">${puntos.map((p) => `<span>${esc(p.etiqueta)}</span>`).join("")}</div>`;
}

function barras(puntos, formato, sufijo) {
  const max = Math.max(1, ...puntos.map((p) => p.valor));
  return puntos.map((p) => `<div class="hb">
    <div class="hb-cab"><span>${esc(p.etiqueta)}</span><span class="v">${formato(p.valor)}</span></div>
    <div class="hb-pista"><i style="width:${(p.valor / max) * 100}%"></i></div>
    ${p.extra !== undefined ? `<div style="font-size:11px;color:var(--humo);margin-top:2px">${p.extra}${sufijo || ""}</div>` : ""}
  </div>`).join("");
}

function duo(puntos, formato) {
  const total = puntos.reduce((t, p) => t + p.valor, 0) || 1;
  return `<div class="duo">${puntos.map((p, i) =>
    `<i style="width:${(p.valor / total) * 100}%;background:${COL[i]}"></i>`).join("")}</div>
  <div class="duo-leyenda">${puntos.map((p, i) =>
    `<div><span style="width:11px;height:11px;border-radius:3px;background:${COL[i]};flex:none"></span>
      <span>${esc(p.etiqueta)}</span><b>${formato(p.valor)}</b>
      <span style="color:var(--humo);width:38px;text-align:right">${Math.round((p.valor / total) * 100)}%</span></div>`).join("")}</div>`;
}

/* ========================== Eventos e inicio ============================== */

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-prod],[data-suc],[data-ir],[data-hoja],[data-cerrar],[data-cant],[data-agregar],[data-lin],[data-entrega],[data-propina],[data-metodo],[data-confirmar],[data-pagar],[data-vista],[data-avanzar],[data-filtro]");
  if (!t) return;
  const d = t.dataset;

  if (d.prod) return abrirProducto(d.prod);
  if (d.ir) { document.getElementById(d.ir).scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (d.cerrar !== undefined) return cerrarHoja();

  if (d.suc !== undefined) {
    S.sucursalId = d.suc;
    if (H && H.tipo === "checkout") {
      const suc = sucursal();
      if (!suc.delivery.zonas.some((z) => z.id === H.zonaId)) {
        H.zonaId = suc.delivery.zonas[0] ? suc.delivery.zonas[0].id : "";
      }
      if (H.entrega === "delivery" && !suc.delivery.habilitado) H.entrega = "retiro";
      return pintarCheckout();
    }
    return render();
  }

  if (d.hoja === "carrito") return pintarCarrito();
  if (d.hoja === "checkout") return abrirCheckout();

  if (d.cant) { H.cant = Math.min(50, Math.max(1, H.cant + Number(d.cant))); return pintarProducto(); }

  if (d.agregar !== undefined) {
    S.carro = [...S.carro, { id: "l" + Date.now(), productId: H.prod.id, cant: H.cant, sel: H.sel, notas: H.notas.trim() }];
    guardar("sc-carro", S.carro);
    cerrarHoja(); pintarBarra(); return;
  }

  if (d.lin) {
    const [id, delta] = d.lin.split("|");
    S.carro = Number(delta) === 0
      ? S.carro.filter((l) => l.id !== id)
      : S.carro.map((l) => (l.id === id ? { ...l, cant: l.cant + Number(delta) } : l)).filter((l) => l.cant > 0);
    guardar("sc-carro", S.carro);
    pintarBarra(); return pintarCarrito();
  }

  if (d.entrega) { H.entrega = d.entrega; H.errores = []; H.malos = []; return pintarCheckout(); }
  if (d.propina) { H.propinaPct = Number(d.propina); return pintarCheckout(); }
  if (d.metodo) { H.metodo = d.metodo; H.errores = []; H.malos = []; return pintarCheckout(); }
  if (d.confirmar !== undefined) return confirmarPedido();
  if (d.pagar) return resolverPago(d.pagar === "ok");

  if (d.vista) { cerrarHoja(); S.vista = d.vista; return render(); }
  if (d.filtro !== undefined) { filtroSucursal = d.filtro; return pintarCocina(); }

  if (d.avanzar) {
    const [id, estado] = d.avanzar.split("|");
    const o = pedidos().find((p) => p.id === id);
    actualizarPedido(id, estado === "recibido" && o.estado === "pendiente_pago"
      ? { estado, pago: { ...o.pago, estado: "pagado" } }
      : estado === "entregado" && o.pago.kind === "contra_entrega"
        ? { estado, pago: { ...o.pago, estado: "pagado" } }
        : { estado });
    return pintarCocina();
  }
});

document.addEventListener("change", (e) => {
  const d = e.target.dataset;
  if (d.op) {
    const [gid, oid, single] = d.op.split("|");
    const actual = H.sel[gid] || [];
    H.tocado = true;
    H.sel = { ...H.sel, [gid]: single === "true" ? [oid]
      : actual.includes(oid) ? actual.filter((x) => x !== oid) : [...actual, oid] };
    return pintarProducto();
  }
  if (d.campo === "zonaId") { H.zonaId = e.target.value; return pintarCheckout(); }
});

document.addEventListener("input", (e) => {
  const d = e.target.dataset;
  if (d.notas !== undefined) { H.notas = e.target.value; return; }
  if (d.campo && d.campo !== "zonaId") {
    H[d.campo] = d.campo === "pagaCon" ? e.target.value.replace(/\D/g, "") : e.target.value;
    e.target.closest(".campo")?.classList.remove("malo");
    H.malos = (H.malos || []).filter((c) => c !== d.campo);
  }
});

document.addEventListener("keydown", (e) => { if (e.key === "Escape") cerrarHoja(); });

// Otra pestaña movió el estado del pedido: refrescar lo que se está viendo.
window.addEventListener("storage", (e) => { if (e.key === "sc-pedidos") render(); });

render();
</script>
